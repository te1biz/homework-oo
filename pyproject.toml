[project]
name = "homework-oo"
version = "0.1.0"
description = ""
authors = [
    {name = "telbiz",email = "telbiz9867@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "autopep8 (>=2.3.2,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:cacheprovider"

[tool.flake8]
max-line-length = 120 

[tool.black]
line-length = 120

